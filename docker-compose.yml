services:
  postgres:
    build:
      context: .
      dockerfile: postgres.Dockerfile
    image: rag-kb-postgres:pg16
    container_name: rag-kb-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rag}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rag}
      POSTGRES_DB: ${POSTGRES_DB:-rag_kb}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - rag_kb_pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-rag} -d ${POSTGRES_DB:-rag_kb}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    # 使用Redis做余额缓存滑动窗口限流
    image: redis/redis-stack-server:7.4.0-v0
    container_name: rag-kb-redis
    restart: unless-stopped
    ports:
      # 宿主端口走 REDIS_PORT
      - "${REDIS_PORT:-6380}:6379"
    volumes:
      - rag_kb_redisdata:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  rag_kb_pgdata:
  rag_kb_redisdata:
