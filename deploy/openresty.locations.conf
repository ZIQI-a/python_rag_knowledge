# 粘贴到 1Panel「rag-knowledge后端站点 → 配置文件」已有的 server 块内。
# 保留面板生成的 listen、server_name、证书和 ACME 配置；替换原 location /。
client_max_body_size 16m;

location /api/ {
    # 文件预览 URL 带短期访问令牌，不记录含完整查询串的访问日志。
    access_log off;
    # 不带末尾斜杠，保留 /api/ 前缀。
    proxy_pass http://127.0.0.1:18100;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # 覆写客户端传入的转发信息，避免信任任意请求头。
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    gzip off;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
    add_header Cache-Control "no-store" always;
}

# 服务器只提供后端，前端静态资源由 Cloudflare Pages 提供。
# MCP 的公网域名白名单需另外配置；本套配置先不开放该入口。
location / {
    return 404;
}
